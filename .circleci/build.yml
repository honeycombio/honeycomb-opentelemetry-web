version: 2.1

parameters:
  build-web-distro:
    type: boolean
    default: false
  build-experimental:
    type: boolean
    default: false

filters_always: &filters_always
  filters:
    tags:
      only: /.*/

filters_publish_web: &filters_publish_web
  filters:
    tags:
      only: /^honeycomb-opentelemetry-web-v[0-9].*/
    branches:
      ignore: /.*/

orbs:
  bats: circleci/bats@1.0.0
  cypress: cypress-io/cypress@3

executors:
  node:
    docker:
      # Keep in sync with .nvmrc. This Node bundles npm 11.17.0, which is
      # required for the `min-release-age` setting in .npmrc.
      - image: cimg/node:24.19.0
  github:
    docker:
      - image: cibuilds/github:0.13.0

jobs:
  checkout-and-install:
    executor: node
    parameters:
      package-path:
        type: string
        default: ''
    steps:
      - checkout
      - run:
          name: Assert npm supports min-release-age
          command: |
            # npm only warns about unknown config keys, so an npm older than
            # 11.10.0 would drop the `min-release-age` protection in .npmrc
            # without failing. `npm config get` echoes the value either way,
            # so grep for the warning instead.
            npm --version
            cd << parameters.package-path >>
            if npm config list 2>&1 | grep -q 'Unknown project config "min-release-age"'; then
              echo "npm $(npm --version) does not support min-release-age" >&2
              exit 1
            fi
      - run:
          name: NPM CI
          command: |
            cd << parameters.package-path >>
            npm ci
      - persist_to_workspace:
          root: << parameters.package-path >>
          paths:
            - ./*

  build:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/*
            - dist/*

  check-format:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run check-format

  lint:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run lint:ci

  # Vitest transpiles without type checking, where ts-jest used to check every
  # test file as it ran. This keeps that guarantee.
  typecheck:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run typecheck

  lint-examples:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run example:lint:all

  test:
    executor: node
    # https://circleci.com/docs/collect-test-data/#jest
    steps:
      - attach_workspace:
          at: ./
      - run:
          name: Run tests with JUnit as reporter
          command: npm run test:ci
      - store_test_results:
          path: ./reports/
      - store_artifacts:
          path: ./reports/

  smoke_test:
    machine:
      image: ubuntu-2204:2024.01.1
    steps:
      - attach_workspace:
          at: ./
      - bats/install
      - run:
          name: What's the BATS?
          command: |
            which bats
            bats --version
      - run: npx cypress install
      - run:
          name: What's the Cypress?
          command: npx cypress --version
      - run:
          name: Spin up and run e2e smoke tests
          command: make smoke
      - store_test_results:
          path: ./smoke-tests/
      - store_artifacts:
          path: ./smoke-tests/report.xml
      - store_artifacts:
          path: ./smoke-tests/collector/data-results
      - run:
          name: Tear down e2e smoke tests
          command: make unsmoke

  publish_github:
    executor: github
    steps:
      - run:
          name: "GHR Draft"
          command: ghr -draft -n ${CIRCLE_TAG} -t ${GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} -r ${CIRCLE_PROJECT_REPONAME} -c ${CIRCLE_SHA1} ${CIRCLE_TAG}

  publish_npm:
    executor: node
    steps:
      - attach_workspace:
          at: ./
      - run: npm run build
      - run: |
          export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
          [[ "${CIRCLE_TAG##*-v}" == *-* ]] && DIST_TAG="next" || DIST_TAG="latest"
          npm publish --access public --tag "$DIST_TAG"

workflows:
  build-web-distro:
    when:
      condition: << pipeline.parameters.build-web-distro >>
    jobs:
      - checkout-and-install:
          <<: *filters_always
          package-path: packages/honeycomb-opentelemetry-web
      - check-format:
          <<: *filters_always
          requires:
            - checkout-and-install
      - lint:
          <<: *filters_always
          requires:
            - checkout-and-install
      - typecheck:
          <<: *filters_always
          requires:
            - checkout-and-install
      - test:
          <<: *filters_always
          requires:
            - checkout-and-install
      - build:
          <<: *filters_always
          requires:
            - checkout-and-install
            - test
      - lint-examples:
          <<: *filters_always
          requires:
            - build
      - smoke_test:
          <<: *filters_always
          requires:
            - build
      - publish_github:
          <<: *filters_publish_web
          context: Honeycomb Secrets for Public Repos
          requires:
            - build
            - smoke_test
      - publish_npm:
          <<: *filters_publish_web
          context: Honeycomb Secrets for Public Repos
          requires:
            - build
            - smoke_test
